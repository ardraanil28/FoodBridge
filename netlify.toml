[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy API calls in production if backend is hosted remotely
# Replace with your backend URL in production Netlify environment settings
[[redirects]]
  from = "/api/*"
  to = "http://localhost:5000/api/:splat"
  status = 200
  force = false

# Single Page Application (SPA) routing: serve index.html for all non-file routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
